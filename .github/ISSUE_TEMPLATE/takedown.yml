name: Image takedown request
description: Request removal of an image asset for which you are the rights holder.
labels: ["takedown"]
title: "[takedown] "
body:
  - type: markdown
    attributes:
      value: |
        For faster handling you can also email the address in
        [SECURITY.md](../blob/main/SECURITY.md). We acknowledge requests
        within 72 hours and remove the image within 7 days. You do not need to give a reason.

  - type: input
    id: post
    attributes:
      label: Link to your original post, or the image's manifest `path` / SHA-256
      description: Any one of these is enough for us to find the image.
      placeholder: "https://www.reddit.com/r/.../comments/... or reddit_vision/electrical/vis-electrical-..."
    validations:
      required: true

  - type: textarea
    id: rights
    attributes:
      label: Your relationship to the asset
      description: For example the person who took or posted the photo, or someone acting for them.
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Additional context (optional)
